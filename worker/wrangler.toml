name = "sensee-messages"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Practitioner accounts and short-lived client messages.
# Create with:  npx wrangler kv namespace create SENSEE
# then paste the id it prints below.
[[kv_namespaces]]
binding = "SENSEE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secret (never put in this file):  npx wrangler secret put ADMIN_TOKEN
