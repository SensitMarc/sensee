/* Layout idea: one soft stage per deck. Each deck re-tints the whole page; the card is the single big, tactile object. */
:root {

  --ink: #12312b;
  --muted: #4a6b62;
  --line: rgba(18, 49, 43, 0.14);

}
:root[data-deck="movement"] { --bg: #d8eaff; --bg2: #c2dcff; --ink: #0d2540; --muted: #43607f; --line: rgba(13,37,64,.14); --accent: #2f6bff; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(13,37,64,.08), 0 12px 32px rgba(13,37,64,.14); }
:root[data-deck="nourish"] { --bg: #e4f3d9; --bg2: #d3ebc2; --ink: #1f3a14; --muted: #52703f; --line: rgba(31,58,20,.14); --accent: #2a7d2e; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(31,58,20,.08), 0 12px 32px rgba(31,58,20,.14); }
:root[data-deck="calm"] { --bg: #e8e2fb; --bg2: #d9d0f7; --ink: #2a2350; --muted: #5b5486; --line: rgba(42,35,80,.14); --accent: #7a5cfa; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(42,35,80,.08), 0 12px 32px rgba(42,35,80,.14); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f2622; --bg2: #14322c; --surface: #19372f; --ink: #e6f6f1; --muted: #9cc2b8; --line: rgba(230,246,241,.16); --accent: #ff8a6b; --on-accent: #2a0e07; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; }
  :root:not([data-theme="light"])[data-deck="movement"] { --bg: #0c1b2e; --bg2: #11263f; --surface: #162f4d; --ink: #e3efff; --muted: #9db8d9; --line: rgba(227,239,255,.16); --accent: #6a96ff; --on-accent: #08162a; }
  :root:not([data-theme="light"])[data-deck="nourish"] { --bg: #12240f; --bg2: #19321a; --surface: #1f3d1f; --ink: #e6f6dc; --muted: #aacd97; --line: rgba(230,246,220,.16); --accent: #7fd36f; --on-accent: #0c1f0a; }
  :root:not([data-theme="light"])[data-deck="calm"] { --bg: #1b1733; --bg2: #241f43; --surface: #2c2652; --ink: #ece8ff; --muted: #b5aee0; --line: rgba(236,232,255,.16); --accent: #a58dff; --on-accent: #1b1733; }
}

:root[data-theme="dark"][data-deck="movement"] { --bg: #0c1b2e; --bg2: #11263f; --surface: #162f4d; --ink: #e3efff; --muted: #9db8d9; --line: rgba(227,239,255,.16); --accent: #6a96ff; --on-accent: #08162a; }
:root[data-theme="dark"][data-deck="nourish"] { --bg: #12240f; --bg2: #19321a; --surface: #1f3d1f; --ink: #e6f6dc; --muted: #aacd97; --line: rgba(230,246,220,.16); --accent: #7fd36f; --on-accent: #0c1f0a; }
:root[data-theme="dark"][data-deck="calm"] { --bg: #1b1733; --bg2: #241f43; --surface: #2c2652; --ink: #ece8ff; --muted: #b5aee0; --line: rgba(236,232,255,.16); --accent: #a58dff; --on-accent: #1b1733; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(120% 70% at 50% 0%, var(--bg2) 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--ink);
  font: 400 17px/1.5 var(--body);
  min-height: 100vh;
  transition: background-color .4s ease, color .4s ease;
}
main { max-width: 560px; margin: 0 auto; padding: 22px 16px 28px; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; flex-direction: column; gap: 6px; }
.brand { margin: 0; font: 700 1rem var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 800 clamp(2.3rem, 9.6vw, 3.4rem)/1.02 var(--display); letter-spacing: -.03em; text-wrap: balance; }
h1 span { color: var(--accent); }
.lede { margin: 0; color: var(--muted); max-width: 40ch; }

.daily { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 4px 16px; }
.daily[hidden] { display: none; }
.daily summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; cursor: pointer; font: 800 1.15rem var(--display); list-style: none; }
.daily summary::-webkit-details-marker { display: none; }
.daily summary::after { content: "\203A"; font-size: 1.6rem; line-height: 1; transition: transform .2s; margin-left: 4px; }
.daily[open] summary::after { transform: rotate(90deg); }
.dcount { margin-left: auto; color: var(--muted); font: 600 1.05rem var(--body); }
.daily ol { list-style: none; margin: 0; padding: 0 0 8px; display: flex; flex-direction: column; }
.daily li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.daily li.done .dtext { opacity: .6; }
.dwho { grid-column: 1; margin: 0; font: 800 .95rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dwho a { color: inherit; text-decoration: none; }
.dtext { grid-column: 1; margin: 0; font-size: 1.1rem; line-height: 1.4; }
.ddone { grid-column: 2; grid-row: 1 / span 2; width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; display: grid; place-items: center; padding: 0; }
.ddone svg { width: 26px; height: 26px; opacity: 0; }
.ddone[aria-pressed=true] { background: var(--accent); color: var(--on-accent); }
.ddone[aria-pressed=true] svg { opacity: 1; }
.dnote { margin: 0; padding: 0 0 12px; color: var(--muted); font-weight: 600; }
.decks { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 6px; padding: 6px; background: var(--line); border-radius: 18px; }
.decks:has(> .deck:nth-child(4):last-child) { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 540px) { .decks:has(> .deck:nth-child(4):last-child) { grid-template-columns: repeat(4, 1fr); } }
.deck { display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font: 700 .98rem var(--display); color: var(--ink); background: transparent; border: 0; border-radius: 13px; padding: 10px 6px; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
.deck svg { width: 18px; height: 18px; flex: none; }
.deck:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.deck[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.deck[aria-pressed="true"] svg { color: var(--accent); }
.blurb { margin: -4px 0 0; color: var(--muted); }
.banner { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.banner[hidden] { display: none; }
.banner b { font: 800 .95rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.banner p { margin: 0; font-weight: 600; }
.react { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.react[hidden] { display: none; }
.react span { font-weight: 700; font-size: 1rem; color: var(--muted); }
.react button { font: 700 1rem var(--body, inherit); border: 1.5px solid var(--accent); background: var(--surface); color: inherit; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.react button[aria-pressed=true] { background: var(--accent); color: #fff; }
.react button:disabled { opacity: .6; cursor: default; }
.react small { flex-basis: 100%; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { flex: none; min-height: 44px; font: 600 1.05rem var(--body); color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.stage { position: relative; padding: 14px 0 6px; }
.stage::before, .stage::after { content: ""; position: absolute; inset: 22px 10px 0; border-radius: 30px; background: var(--surface); opacity: .55; box-shadow: var(--shadow); z-index: 0; }
.stage::before { transform: rotate(-2.2deg); }
.stage::after { transform: rotate(1.8deg); opacity: .75; }
.card { position: relative; z-index: 1; overflow: hidden; background: var(--surface); border-radius: 30px; padding: 20px 22px 26px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.mark { position: absolute; right: -14px; bottom: 6px; width: 170px; height: 170px; color: var(--accent); opacity: .13; transform: rotate(-12deg); pointer-events: none; transition: opacity .3s; }
.mark svg { width: 100%; height: 100%; }
.card-top, .text, .card-foot { position: relative; }
.card-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.try { display: inline-flex; align-items: center; gap: 8px; font: 700 1.05rem var(--display); color: var(--ink); background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; padding: 9px 16px; cursor: pointer; font-variant-numeric: tabular-nums; }
.try[hidden] { display: none; }
.seenbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 12px 4px; font: 700 1.05rem var(--display); color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkbtn:disabled { opacity: .4; cursor: default; text-decoration: none; }
.linkbtn[hidden], #seenBox[hidden] { display: none; }
#seenBox { display: flex; flex-direction: column; gap: 8px; }
#seenList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#seenList button { width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
#seenList button:hover, #seenList button:focus-visible { border-color: var(--accent); }
#seenList small { color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: .9rem; }
#seenList span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.seennote { margin: 0; color: var(--muted); font-size: 1rem; }
.recipe { position: relative; display: flex; flex-direction: column; gap: 6px; font-size: 1.1rem; border-top: 1.5px dashed var(--line); padding-top: 12px; }
.recipe[hidden] { display: none; }
.recipe b { font: 700 .95rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.recipe ul, .recipe ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 3px; }
.recipe p { margin: 0; }
.rtime { font-weight: 700; color: var(--accent); }
.rnote { color: var(--muted); font-size: 1rem; }
.try[data-running="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.cheer { font-weight: 700; color: var(--accent); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 0 6px 6px 0; transition: width .35s ease; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kind { font: 800 .95rem var(--display); letter-spacing: .1em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 5px 14px; }
.count { color: var(--muted); font: 600 1.05rem var(--body); font-variant-numeric: tabular-nums; }
.text { margin: 4px 0 0; font: 600 clamp(1.6rem, 6.6vw, 2.3rem)/1.2 var(--display); letter-spacing: -.01em; text-wrap: pretty; }
.card.deal { animation: deal .42s cubic-bezier(.2,.9,.3,1.2); }
@keyframes deal { from { transform: translateY(26px) rotate(-3deg) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }

.actions { display: flex; gap: 10px; position: sticky; bottom: 0; z-index: 5; padding: 14px 0 12px; margin-bottom: -12px; background: linear-gradient(to top, var(--bg) 62%, transparent); }
.btn { font: 800 1.1rem var(--display); border: 0; border-radius: 18px; padding: 16px 22px; cursor: pointer; background: var(--accent); color: var(--on-accent); flex: 1; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 38%, transparent); transition: transform .12s, box-shadow .12s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 38%, transparent); }
.btn.ghost { flex: 0 0 auto; background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.status { min-height: 1.5em; margin: -6px 0 0; color: var(--muted); font-weight: 600; }
.note { margin: 0; color: var(--muted); font-size: 1rem; }
.note[hidden] { display: none; }
.tally { margin: 0; color: var(--muted); font-size: 1.05rem; }
.foot { border-top: 1.5px solid var(--line); padding-top: 14px; font-size: 1.05rem; display: flex; gap: 8px; flex-wrap: wrap; }
.foot a { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .card.deal { animation: none; } body, .deck, .chip, .btn, .bar i, .mark { transition: none; } }
@media (max-width: 380px) { .deck { font-size: .92rem; padding: 10px 4px; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">sensee.ca</p>
    <h1>Sense it. See it. <span>Do it.</span></h1>
  </header>

  <details class="daily" id="daily" open hidden>
    <summary><span>Today's four</span><span class="dcount" id="dcount"></span></summary>
    <ol id="dlist"></ol>
    <p class="dnote" id="dnote" aria-live="polite"></p>
  </details>

  <div class="decks" role="group" aria-label="Deck" id="decks"></div>
  <p class="blurb" id="blurb"></p>
  <div class="banner" id="banner" hidden><b id="bannerTitle"></b><p id="bannerText"></p><div class="react" id="react" hidden><span id="reactAsk">Let them know:</span><button type="button" data-r="helpful">&#x1F44D; Helpful</button><button type="button" data-r="tried">&#x2705; Tried it</button><button type="button" data-r="help">&#x1F64B; Need a hand</button><small id="reactMsg" role="status"></small></div></div>
  <div class="chips" role="group" aria-label="Kind of card" id="chips"></div>

  <div class="stage">
    <section class="card" id="card">
      <div class="mark" id="mark" aria-hidden="true"></div>
      <div class="card-top">
        <span class="kind" id="kind"></span>
        <span class="count" id="count"></span>
      </div>
      <p class="text" id="text" aria-live="polite"></p>
      <div class="recipe" id="recipe" hidden>
        <p class="rtime" id="rtime"></p>
        <b>You will need</b><ul id="ritems"></ul>
        <b>Steps</b><ol id="rsteps"></ol>
        <p class="rnote">Swap anything you are allergic to or avoiding.</p>
      </div>
      <div class="card-foot">
        <button class="try" id="try" hidden>Try it now · 1 min</button>
        <button class="try" id="seeRecipe" hidden aria-expanded="false">See recipe</button>
        <span class="cheer" id="cheer" aria-live="polite"></span>
      </div>
      <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    </section>
  </div>

  <div class="actions">
    <button class="btn" id="next">Draw another</button>
    <button class="btn ghost" id="copy">Copy to send</button>
  </div>
  <p class="status" id="msg" aria-live="polite"></p>
  <div class="seenbar">
    <button type="button" class="linkbtn" id="back" disabled>&lsaquo; Previous card</button>
    <button type="button" class="linkbtn" id="seenToggle" aria-expanded="false" aria-controls="seenBox" hidden>Seen cards</button>
  </div>
  <div id="seenBox" hidden>
    <ol id="seenList"></ol>
    <button type="button" class="linkbtn" id="seenClear">Clear list</button>
    <p class="seennote">Saved on this device only.</p>
  </div>
  <p class="note" id="note" hidden></p>
  <p class="tally" id="tally"></p>
  <footer class="foot"><a href="share.html">For practitioners</a> <span aria-hidden="true">·</span> <a href="mailto:sensitlabs@gmail.com">Send feedback</a></footer>
</main>

<script>
const EVERYDAY = [
  ["Do", "Text someone one specific thing you remember fondly about them. No question attached."],
  ["Do", "Leave the closest parking spot or the first seat for someone else."],
  ["Do", "Open a window for one minute and let the outside in."],
  ["Do", "Drink a full glass of water, slowly, like it's the best thing you've had all day."],
  ["Do", "Put on one song you love and move around for its whole length. Nobody is grading."],
  ["Do", "Leave a kind, specific review for a small business you like."],
  ["Do", "Tidy exactly one surface. Stop when it's done."],
  ["Do", "Ask the next person you talk to what the best part of their day was, then listen to the answer."],
  ["Do", "Hold the door a little longer than necessary and smile at whoever comes through."],
  ["Do", "Pay someone a compliment about a choice they made, not how they look."],
  ["Do", "Write down three things that went okay today. Okay counts."],
  ["Do", "Pet a dog, after asking its person first."],
  ["Do", "Unclench your jaw and drop your shoulders. Now do it again."],
  ["Notice", "Find something yellow within sight. Look at it for ten full seconds."],
  ["Notice", "Listen for the farthest sound you can hear, then the closest."],
  ["Notice", "Look at the sky for thirty seconds. What is it doing right now?"],
  ["Notice", "Find the oldest object in the room. Think about everything it has seen."],
  ["Notice", "Feel the temperature of the air on your hands. Is it warm, cool, or somewhere nice in between?"],
  ["Notice", "Pick one thing near you that someone else designed carefully, like a hinge, a handle or a font."],
  ["Notice", "Notice one person nearby doing something small and kind. Most of it goes unseen."],
  ["Thank", "Think of a teacher who changed how you see something. Send them a short thank-you."],
  ["Thank", "Name someone who made your week easier. Tell them today."],
  ["Thank", "Thank a person who does work you usually don't notice: the cleaner, the driver, the person who restocks the shelves."],
  ["Thank", "Think of a friend who stayed in touch when you didn't. Reach out and say so."],
  ["Thank", "Thank your past self for one thing they did that you're benefiting from today."],
  ["Thank", "Call or message a relative and thank them for one thing they taught you."],
  ["Fact", "Sea otters sometimes hold hands while they sleep so they don't drift apart."],
  ["Fact", "Octopuses have three hearts."],
  ["Fact", "A group of flamingos is called a flamboyance."],
  ["Fact", "Wombats produce cube-shaped droppings, which helps them stay put when used as markers."],
  ["Fact", "Botanically, a banana is a berry. A strawberry is not."],
  ["Fact", "Sunlight takes a little over eight minutes to reach Earth. Today's warmth left the Sun before you finished your morning."],
  ["Fact", "Cows form close friendships and show lower stress when they're with their favorite companions."],
  ["Fact", "Honey found in ancient Egyptian tombs was still edible. Properly stored honey barely spoils."],
  ["Fact", "Bumblebees can learn by watching other bees, and have been taught to roll a ball for a sugary reward."]
];

const DECKS = [
  { id: "everyday", name: "Everyday", icon: "sun", blurb: "Little things to do, notice, thank and learn.", note: "",
    cards: EVERYDAY },
  { id: "movement", name: "Movement", icon: "bolt", blurb: "Small nudges to get moving, build the habit and keep going. Made for practitioners to share with their clients.",
    note: "Encouragement, not medical advice. Follow your practitioner's plan.",
    cards: [
      ["Move", "Stand up and roll your shoulders back ten times, slowly."],
      ["Move", "Take a two-minute walk, even if it is just around the room."],
      ["Move", "Do five slow sit-to-stands from a chair, taking your time on the way down."],
      ["Move", "Stretch whatever feels tightest for thirty seconds, breathing out as you ease in."],
      ["Move", "Stand on one foot while you brush your teeth, then switch."],
      ["Move", "Take the longer route to your next destination."],
      ["Move", "Do ten slow calf raises while you wait for the kettle."],
      ["Move", "March in place for one minute."],

    const t = document.createElement("span"); t.textContent = d.name; b.appendChild(t);
    b.addEventListener("click", () => { location.hash = d.id; });
    box.appendChild(b);
  });
}
function renderChips() {
  const box = $("chips"); box.textContent = "";
  const kinds = ["All"].concat(cardsOf().map(c => c[0]).filter((k, i, a) => a.indexOf(k) === i));
  kinds.forEach(k => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = k; b.setAttribute("aria-pressed", String(k === kind));
    b.addEventListener("click", () => { kind = k; current = null; pile = []; renderChips(); draw(false); });
    box.appendChild(b);
  });
}
function openDeck(id, first, pid) {
  deckId = DECKS.some(d => d.id === id) ? id : "everyday";
  planId = deckId === "kine" && KINE && KINE.plans && KINE.plans[pid] ? pid : "";
  document.documentElement.dataset.deck = deckId === "kine" ? "movement" : deckId;
  kind = "All"; current = null; pile = []; trail = [];
  const pl = plan();
  $("blurb").textContent = pl ? (pl.note || pl.label || "") : deck().blurb;
  const note = $("note"); note.textContent = deck().note || ""; note.hidden = !deck().note;
  const bn = $("banner"), msg = KINE && KINE.message;
  if (deckId === "kine" && msg && msg.text) {
    $("bannerTitle").textContent = msg.title || ("From " + KINE.name); $("bannerText").textContent = msg.text; bn.hidden = false;
  } else if (LINK_MSG) {
    $("bannerTitle").textContent = LINK_MSG.from ? "Message from " + LINK_MSG.from : "A personal message";
    const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const greeted = LINK_MSG.to && new RegExp("^\\s*(?:(?:hi|hello|hey|dear|good (?:morning|afternoon|evening))\\b|" + esc(LINK_MSG.to) + "\\b)", "i").test(LINK_MSG.text);
    $("bannerText").textContent = (LINK_MSG.to && !greeted ? "Hi " + LINK_MSG.to + ". " : "") + LINK_MSG.text;
    bn.hidden = false;
  } else { bn.hidden = true; }
  const rx = $("react"); rx.hidden = !(LINK_MSG && LINK_MSG.id && !(deckId === "kine" && msg && msg.text));
  if (!rx.hidden) {
    $("reactAsk").textContent = LINK_MSG.from ? "Let " + LINK_MSG.from + " know:" : "Let them know:";
    rx.querySelectorAll("button").forEach(b => { const on = (LINK_MSG.react || []).indexOf(b.dataset.r) >= 0; b.setAttribute("aria-pressed", on); });
  }
  renderDecks(); renderChips(); draw(first); renderDaily();
}
$("next").addEventListener("click", () => draw(false));
$("try").addEventListener("click", runTry);
$("back").addEventListener("click", () => {
  if (!trail.length) return;
  render(trail.pop()); $("count").textContent = "Seen before"; $("fill").style.width = "100%"; setBack();
});
$("seenToggle").addEventListener("click", () => {
  const open = $("seenBox").hidden; $("seenBox").hidden = !open; $("seenToggle").setAttribute("aria-expanded", String(open));
});
$("seenClear").addEventListener("click", () => { saveSeen(current ? [{ d: deckId, c: current }] : []); renderSeen(); });
$("seeRecipe").addEventListener("click", () => showRecipe($("seeRecipe").getAttribute("aria-expanded") !== "true"));
$("copy").addEventListener("click", async () => {
  const link = location.href.split("#")[0] + (deckId === "everyday" ? "" : "#" + deckId + (planId ? "/" + planId : ""));
  try { const rec = validRecipe(current[2]) ? "\n\n" + current[2].time + "\nYou will need:\n- " + current[2].items.join("\n- ") + "\nSteps:\n" + current[2].steps.map((s, i) => (i + 1) + ". " + s).join("\n") + "\nSwap anything you are allergic to or avoiding." : "";
    await navigator.clipboard.writeText(current[0] + ": " + current[1] + rec + "\n" + link); $("msg").textContent = "Copied. Send it to someone who could use it."; }
  catch (e) { $("msg").textContent = "Couldn't copy here. Select the card text and copy it by hand."; }
});
$("react").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b || !LINK_MSG || !LINK_MSG.id) return;
  const api = (window.SENSEE_API || "").replace(/\/$/, ""), out = $("reactMsg");
  b.disabled = true;
  try {
    const r = await fetch(api + "/m/" + encodeURIComponent(LINK_MSG.id) + "/react", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ r: b.dataset.r }) });
    if (!r.ok) throw new Error("bad status");
    LINK_MSG.react = (await r.json()).react || [];
    b.setAttribute("aria-pressed", "true");
    out.textContent = "Sent" + (LINK_MSG.from ? " to " + LINK_MSG.from : "") + ". Thank you.";
  } catch (err) { out.textContent = "Couldn't send that just now. Try again."; }
  b.disabled = false;
});
/* Short link: sensee.ca/#m=ID. The message is stored by the Sensee Worker and fetched here. */
async function loadStored(id) {
  const api = (window.SENSEE_API || "").replace(/\/$/, "");
  if (!api) { LINK_MSG = { text: "This message link needs the Sensee message service, which isn't switched on yet.", from: "", to: "", notice: true }; return "everyday"; }
  try {
    const r = await fetch(api + "/m/" + encodeURIComponent(id));
    if (r.status === 404) { LINK_MSG = { text: "This message has expired or was removed.", from: "", to: "", notice: true }; return "everyday"; }
    if (!r.ok) throw new Error("bad status");
    const m = await r.json();
    const clean = (v, n) => String(v || "").replace(/[\u0000-\u001f\u007f]/g, " ").trim().slice(0, n);
    LINK_MSG = { id: id, text: clean(m.text, 400), from: clean(m.from, 60), to: clean(m.to, 40), react: Array.isArray(m.react) ? m.react : [] };
    return ["everyday", "movement", "calm", "nourish"].indexOf(m.deck) >= 0 ? m.deck : "everyday";
  } catch (e) {
    LINK_MSG = { text: "Couldn't load the message. Check your connection and open the link again.", from: "", to: "", notice: true };
    return "everyday";
  }
}
async function route(first) {
  const h = parseHash();
  if (LINK_MSG && LINK_MSG.notice && !h.mid) LINK_MSG = null;   // error notices don't follow the client to other decks
  if (h.mid) { const deckFromMsg = await loadStored(h.mid); openDeck(deckFromMsg, first, ""); return; }
  readMsg(h.q); openDeck(h.d, first, h.p);
}
window.addEventListener("hashchange", () => { route(false); });
showTally(getCount());
route(true);
/* Extra cards approved by the admin are served by the Worker and merged into the built-in decks. Failure changes nothing. */
(async function loadExtraCards() {
  const api = (window.SENSEE_API || "").replace(/\/$/, ""); if (!api) return;
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch(api + "/cards", { signal: ctl.signal }); clearTimeout(t);
    if (!r.ok) return;
    const extra = await r.json(); let added = 0;
    DECKS.forEach(d => {
      if (d.id === "kine" || !Array.isArray(extra[d.id])) return;
      const have = new Set(d.cards.map(c => c[1]));
      extra[d.id].forEach(c => {
        if (Array.isArray(c) && typeof c[0] === "string" && typeof c[1] === "string" && KIND_ICON[c[0]] && c[1].length <= 200 && !have.has(c[1])) { d.cards.push(validRecipe(c[2]) ? [c[0], c[1], c[2]] : [c[0], c[1]]); have.add(c[1]); added++; }
      });
    });
    if (added) { renderChips(); pile = []; }
  } catch (e) {}
})();

/* "My kine" deck: the kinesiologist's own message and cards, from kine.json. Shown only when enabled.
   kine.json is public (this repo is public): keep it free of names and health details. */
fetch("kine.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(k => {
  if (!k || k.enabled !== true || !Array.isArray(k.cards) && !k.plans) return;
  const clean = list => (Array.isArray(list) ? list : []).filter(c => Array.isArray(c) && typeof c[0] === "string" && typeof c[1] === "string").map(c => [c[0], c[1]]);
  const plans = {}; let all = clean(k.cards);
  Object.keys(k.plans || {}).forEach(id => {
    const pl = k.plans[id] || {}; const cs = clean(pl.cards);
    if (cs.length) { plans[id] = { label: String(pl.label || id), note: String(pl.note || ""), cards: cs }; all = all.concat(cs); }
  });
  if (!all.length) return;
  KINE = { name: String(k.name || "your kinesiologist"), message: k.message || null, plans };
  DECKS.push({ id: "kine", name: "My kine", icon: "heart", blurb: "Cards and messages from " + KINE.name + ".", note: "Encouragement, not medical advice. Follow your practitioner's plan.", cards: all });
  const h = parseHash(); openDeck(h.d === "kine" ? "kine" : deckId, false, h.p);
}).catch(() => {});
</script>
