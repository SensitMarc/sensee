<title>Sense it. See it. Do it. · Sensee</title>

<style>
/* Layout idea: one soft stage per deck. Each deck re-tints the whole page; the card is the single big, tactile object. */
:root {
  --bg: #d9f4e8;
  --bg2: #c4ecdb;
  --surface: #ffffff;
  --ink: #12312b;
  --muted: #4a6b62;
  --line: rgba(18, 49, 43, 0.14);
  --accent: #ff6b4a;
  --on-accent: #2a0e07;
  --shadow: 0 1px 2px rgba(18,49,43,.08), 0 12px 32px rgba(18,49,43,.12);
  --display: "Gabarito", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-deck="movement"] { --bg: #d8eaff; --bg2: #c2dcff; --ink: #0d2540; --muted: #43607f; --line: rgba(13,37,64,.14); --accent: #2f6bff; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(13,37,64,.08), 0 12px 32px rgba(13,37,64,.14); }
:root[data-deck="calm"] { --bg: #e8e2fb; --bg2: #d9d0f7; --ink: #2a2350; --muted: #5b5486; --line: rgba(42,35,80,.14); --accent: #7a5cfa; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(42,35,80,.08), 0 12px 32px rgba(42,35,80,.14); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f2622; --bg2: #14322c; --surface: #19372f; --ink: #e6f6f1; --muted: #9cc2b8; --line: rgba(230,246,241,.16); --accent: #ff8a6b; --on-accent: #2a0e07; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; }
  :root:not([data-theme="light"])[data-deck="movement"] { --bg: #0c1b2e; --bg2: #11263f; --surface: #162f4d; --ink: #e3efff; --muted: #9db8d9; --line: rgba(227,239,255,.16); --accent: #6a96ff; --on-accent: #08162a; }
  :root:not([data-theme="light"])[data-deck="calm"] { --bg: #1b1733; --bg2: #241f43; --surface: #2c2652; --ink: #ece8ff; --muted: #b5aee0; --line: rgba(236,232,255,.16); --accent: #a58dff; --on-accent: #1b1733; }
}
:root[data-theme="dark"] { --bg: #0f2622; --bg2: #14322c; --surface: #19372f; --ink: #e6f6f1; --muted: #9cc2b8; --line: rgba(230,246,241,.16); --accent: #ff8a6b; --on-accent: #2a0e07; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); color-scheme: dark; }
:root[data-theme="dark"][data-deck="movement"] { --bg: #0c1b2e; --bg2: #11263f; --surface: #162f4d; --ink: #e3efff; --muted: #9db8d9; --line: rgba(227,239,255,.16); --accent: #6a96ff; --on-accent: #08162a; }
:root[data-theme="dark"][data-deck="calm"] { --bg: #1b1733; --bg2: #241f43; --surface: #2c2652; --ink: #ece8ff; --muted: #b5aee0; --line: rgba(236,232,255,.16); --accent: #a58dff; --on-accent: #1b1733; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(120% 70% at 50% 0%, var(--bg2) 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--ink);
  font: 400 17px/1.5 var(--body);
  min-height: 100vh;
  transition: background-color .4s ease, color .4s ease;
}
main { max-width: 560px; margin: 0 auto; padding: 22px 16px 28px; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; flex-direction: column; gap: 6px; }
.brand { margin: 0; font: 700 .85rem var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 800 clamp(2.3rem, 9.6vw, 3.4rem)/1.02 var(--display); letter-spacing: -.03em; text-wrap: balance; }
h1 span { color: var(--accent); }
.lede { margin: 0; color: var(--muted); max-width: 40ch; }

.decks { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 6px; padding: 6px; background: var(--line); border-radius: 18px; }
.deck { display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font: 700 .98rem var(--display); color: var(--ink); background: transparent; border: 0; border-radius: 13px; padding: 10px 6px; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
.deck svg { width: 18px; height: 18px; flex: none; }
.deck:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.deck[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.deck[aria-pressed="true"] svg { color: var(--accent); }
.blurb { margin: -4px 0 0; color: var(--muted); }
.banner { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-left: 5px solid var(--accent); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.banner[hidden] { display: none; }
.banner b { font: 800 .82rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.banner p { margin: 0; font-weight: 600; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 600 .92rem var(--body); color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.stage { position: relative; padding: 14px 0 6px; }
.stage::before, .stage::after { content: ""; position: absolute; inset: 22px 10px 0; border-radius: 30px; background: var(--surface); opacity: .55; box-shadow: var(--shadow); z-index: 0; }
.stage::before { transform: rotate(-2.2deg); }
.stage::after { transform: rotate(1.8deg); opacity: .75; }
.card { position: relative; z-index: 1; overflow: hidden; background: var(--surface); border-radius: 30px; padding: 20px 22px 26px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.mark { position: absolute; right: -14px; bottom: 6px; width: 170px; height: 170px; color: var(--accent); opacity: .13; transform: rotate(-12deg); pointer-events: none; transition: opacity .3s; }
.mark svg { width: 100%; height: 100%; }
.card-top, .text, .card-foot { position: relative; }
.card-foot { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.try { display: inline-flex; align-items: center; gap: 8px; font: 700 .95rem var(--display); color: var(--ink); background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 999px; padding: 9px 16px; cursor: pointer; font-variant-numeric: tabular-nums; }
.try[hidden] { display: none; }
.try[data-running="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.cheer { font-weight: 700; color: var(--accent); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 0 6px 6px 0; transition: width .35s ease; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kind { font: 800 .8rem var(--display); letter-spacing: .1em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 5px 14px; }
.count { color: var(--muted); font: 600 .9rem var(--body); font-variant-numeric: tabular-nums; }
.text { margin: 4px 0 0; font: 600 clamp(1.6rem, 6.6vw, 2.3rem)/1.2 var(--display); letter-spacing: -.01em; text-wrap: pretty; }
.card.deal { animation: deal .42s cubic-bezier(.2,.9,.3,1.2); }
@keyframes deal { from { transform: translateY(26px) rotate(-3deg) scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }

.actions { display: flex; gap: 10px; position: sticky; bottom: 0; z-index: 5; padding: 14px 0 12px; margin-bottom: -12px; background: linear-gradient(to top, var(--bg) 62%, transparent); }
.btn { font: 800 1.1rem var(--display); border: 0; border-radius: 18px; padding: 16px 22px; cursor: pointer; background: var(--accent); color: var(--on-accent); flex: 1; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 38%, transparent); transition: transform .12s, box-shadow .12s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 38%, transparent); }
.btn.ghost { flex: 0 0 auto; background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.status { min-height: 1.5em; margin: -6px 0 0; color: var(--muted); font-weight: 600; }
.note { margin: 0; color: var(--muted); font-size: .85rem; }
.note[hidden] { display: none; }
.tally { margin: 0; color: var(--muted); font-size: .92rem; }
.foot { border-top: 1.5px solid var(--line); padding-top: 14px; font-size: .92rem; display: flex; gap: 8px; flex-wrap: wrap; }
.foot a { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .card.deal { animation: none; } body, .deck, .chip, .btn, .bar i, .mark { transition: none; } }
@media (max-width: 380px) { .deck { font-size: .92rem; padding: 10px 4px; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">sensee.ca</p>
    <h1>Sense it. See it. <span>Do it.</span></h1>
    <p class="lede">Small good things, one card at a time. Each takes under a minute and tends to leave the day a little lighter than it found it.</p>
  </header>

  <div class="decks" role="group" aria-label="Deck" id="decks"></div>
  <p class="blurb" id="blurb"></p>
  <div class="banner" id="banner" hidden><b id="bannerTitle"></b><p id="bannerText"></p></div>
  <div class="chips" role="group" aria-label="Kind of card" id="chips"></div>

  <div class="stage">
    <section class="card" id="card">
      <div class="mark" id="mark" aria-hidden="true"></div>
      <div class="card-top">
        <span class="kind" id="kind"></span>
        <span class="count" id="count"></span>
      </div>
      <p class="text" id="text" aria-live="polite"></p>
      <div class="card-foot">
        <button class="try" id="try" hidden>Try it now · 1 min</button>
        <span class="cheer" id="cheer" aria-live="polite"></span>
      </div>
      <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    </section>
  </div>

  <div class="actions">
    <button class="btn" id="next">Draw another</button>
    <button class="btn ghost" id="copy">Copy to send</button>
  </div>
  <p class="status" id="msg" aria-live="polite"></p>
  <p class="note" id="note" hidden></p>
  <p class="tally" id="tally"></p>
  <footer class="foot"><span>Prototype in testing.</span> <a href="share.html">For practitioners: send a personal message</a> <span aria-hidden="true">·</span> <a href="mailto:sensitlabs@gmail.com">Send feedback</a></footer>
</main>
<script>
const EVERYDAY = [
  ["Do", "Text someone one specific thing you remember fondly about them. No question attached."],
  ["Do", "Leave the closest parking spot or the first seat for someone else."],
  ["Do", "Open a window for one minute and let the outside in."],
  ["Do", "Drink a full glass of water, slowly, like it's the best thing you've had all day."],
  ["Do", "Put on one song you love and move around for its whole length. Nobody is grading."],
  ["Do", "Leave a kind, specific review for a small business you like."],
  ["Do", "Tidy exactly one surface. Stop when it's done."],
  ["Do", "Ask the next person you talk to what the best part of their day was, then listen to the answer."],
  ["Do", "Hold the door a little longer than necessary and smile at whoever comes through."],
  ["Do", "Pay someone a compliment about a choice they made, not how they look."],
  ["Do", "Write down three things that went okay today. Okay counts."],
  ["Do", "Pet a dog, after asking its person first."],

  ["Notice", "Look at the sky for thirty seconds. What is it doing right now?"],
  ["Notice", "Find the oldest object in the room. Think about everything it has seen."],
  ["Notice", "Feel the temperature of the air on your hands. Is it warm, cool, or somewhere nice in between?"],
  ["Notice", "Pick one thing near you that someone else designed carefully, like a hinge, a handle or a font."],
  ["Notice", "Notice one person nearby doing something small and kind. Most of it goes unseen."],
  ["Thank", "Think of a teacher who changed how you see something. Send them a short thank-you."],
  ["Thank", "Name someone who made your week easier. Tell them today."],
  ["Thank", "Thank a person who does work you usually don't notice: the cleaner, the driver, the person who restocks the shelves."],
  ["Thank", "Think of a friend who stayed in touch when you didn't. Reach out and say so."],
  ["Thank", "Thank your past self for one thing they did that you're benefiting from today."],
  ["Thank", "Call or message a relative and thank them for one thing they taught you."],
  ["Fact", "Sea otters sometimes hold hands while they sleep so they don't drift apart."],
  ["Fact", "Octopuses have three hearts."],
  ["Fact", "A group of flamingos is called a flamboyance."],
  ["Fact", "Wombats produce cube-shaped droppings, which helps them stay put when used as markers."],
  ["Fact", "Botanically, a banana is a berry. A strawberry is not."],
  ["Fact", "Sunlight takes a little over eight minutes to reach Earth. Today's warmth left the Sun before you finished your morning."],
  ["Fact", "Cows form close friendships and show lower stress when they're with their favorite companions."],
  ["Fact", "Honey found in ancient Egyptian tombs was still edible. Properly stored honey barely spoils."],
  ["Fact", "Bumblebees can learn by watching other bees, and have been taught to roll a ball for a sugary reward."]
];

const DECKS = [
  { id: "everyday", name: "Everyday", icon: "sun", blurb: "Little prompts to do, notice, thank and learn.", note: "",
    cards: EVERYDAY },
  { id: "movement", name: "Movement", icon: "bolt", blurb: "Short prompts to get moving, build the habit and keep going. Made for practitioners to share with their clients.",
    note: "General encouragement only, not medical advice. Follow your practitioner's plan.",
    cards: [
      ["Move", "Stand up and roll your shoulders back ten times, slowly."],
      ["Move", "Take a two-minute walk, even if it is just around the room."],
      ["Move", "Do five slow sit-to-stands from a chair, taking your time on the way down."],
      ["Move", "Stretch whatever feels tightest for thirty seconds, breathing out as you ease in."],
      ["Move", "Stand on one foot while you brush your teeth, then switch."],
      ["Move", "Take the longer route to your next destination."],
      ["Move", "Do ten slow calf raises while you wait for the kettle."],
      ["Move", "March in place for one minute."],
      ["Mindset", "Five minutes is a real session. Showing up counts."],
      ["Mindset", "Progress is rarely a straight line. A flat week is still part of the trend."],
      ["Mindset", "Compare today's effort to your own last month, not to anyone else."],
      ["Mindset", "A smaller version of the plan, done, beats a perfect version skipped."],
      ["Mindset", "Strong is a skill you build one ordinary day at a time."],
      ["Mindset", "You do not have to feel motivated to start. Start, and motivation often follows."],
      ["Habit", "Attach one exercise to something you already do every day, like coffee or brushing your teeth."],
      ["Habit", "Lay out your workout clothes tonight so tomorrow's start is easier."],
      ["Habit", "Put your next session in your calendar now, with a time and a place."],
      ["Habit", "Pick the easiest version of your exercise and do just that tomorrow."],
      ["Habit", "Tell one person when you plan to move today."],
      ["Habit", "Mark a calendar after each session and watch the chain grow."],
      ["Reflect", "What is one thing your body did for you today that you usually take for granted?"],
      ["Reflect", "When did movement last leave you feeling better than when you started? What was it?"],
      ["Reflect", "What is getting in the way this week, and what is the smallest way around it?"],
      ["Reflect", "What would future you thank you for doing in the next ten minutes?"],
      ["Reflect", "Which part of your routine feels easy now that felt hard a month ago?"],
      ["Reflect", "Who or what helps you keep going? How could you lean on it more?"]
    ] },
  { id: "calm", name: "Calm", icon: "moon", blurb: "Quick resets for a busy head.", note: "",
    cards: [
      ["Breathe", "Breathe in for four, out for six. Repeat three times."],
      ["Breathe", "Make your exhale a little slower than your inhale for one minute."],
      ["Breathe", "Rest a hand on your belly and feel it rise and fall for five breaths."],
      ["Ground", "Name five things you can see, four you can touch and three you can hear."],
      ["Ground", "Press your feet into the floor and notice the support under you."],
      ["Ground", "Look at the farthest thing you can see for ten seconds."],
      ["Soften", "Unclench your jaw, drop your shoulders and let your hands go loose."],
      ["Soften", "Tell yourself: this moment will pass, and I can take it one breath at a time."],
      ["Soften", "Take a sip of something warm and notice it all the way down."],
      ["Reset", "Step away from the screen for two minutes."],
      ["Reset", "Write down the one thing that matters most today and set the rest aside."],
      ["Reset", "Open a window and take three slow breaths of fresh air."],
      ["Reset", "Do one thing, then the next. Only the next thing."]
    ] }
];

const ICONS = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>'
};
const PATHS = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  sparkle: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>',
  sprout: '<path d="M12 21v-9"/><path d="M12 12c0-4 3-6 8-6 0 4-3 6-8 6z"/><path d="M12 15c0-3-2-5-7-5 0 3 2 5 7 5z"/>',
  loop: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  ripple: '<circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/>',
  wind: '<path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/><path d="M17.7 7.7A2.5 2.5 0 1 1 19.5 12H2"/>',
  anchor: '<circle cx="12" cy="5" r="3"/><path d="M12 8v14"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9z"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'
};
const KIND_ICON = { Do: "check", Notice: "eye", Thank: "heart", Fact: "sparkle", Move: "bolt", Mindset: "sprout", Habit: "loop", Reflect: "ripple", Breathe: "wind", Ground: "anchor", Soften: "cloud", Reset: "refresh" };
const TRY_KINDS = ["Do", "Move", "Notice", "Breathe", "Ground", "Soften", "Reset"];
const TRY_SECONDS = 60;
const markSvg = name => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' + (PATHS[name] || PATHS.sparkle) + '</svg>';
const $ = id => document.getElementById(id);
let deckId = "everyday", planId = "", kind = "All", pile = [], total = 0, current = null;
let KINE = null;   // loaded from kine.json when enabled
const deck = () => DECKS.find(d => d.id === deckId) || DECKS[0];
const plan = () => (deckId === "kine" && KINE && planId && KINE.plans && KINE.plans[planId]) || null;
const cardsOf = () => plan() ? plan().cards : deck().cards;
function parseHash() {
  const raw = location.hash.slice(1), qi = raw.indexOf("?");
  const h = (qi >= 0 ? raw.slice(0, qi) : raw).split("/");
  let q = null; try { q = qi >= 0 ? new URLSearchParams(raw.slice(qi + 1)) : null; } catch (e) {}
  return { d: h[0] || "", p: h[1] || "", q };
}
/* A practitioner's personal message travels inside the link (#deck?m=...&f=...&t=...). It is shown as plain text only. */
let LINK_MSG = null;
function readMsg(q) {
  if (!q) return;
  const clean = (v, n) => String(v || "").replace(/[\u0000-\u001f\u007f]/g, " ").trim().slice(0, n);
  const m = clean(q.get("m"), 400);
  if (m) LINK_MSG = { text: m, from: clean(q.get("f"), 40), to: clean(q.get("t"), 40) };
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function refill() {
  const pool = cardsOf().filter(c => kind === "All" || c[0] === kind);
  total = pool.length;
  pile = shuffle(pool);
  if (current && pile.length > 1 && pile[pile.length - 1] === current) pile.unshift(pile.pop());
}
function today() { return new Date().toISOString().slice(0, 10); }
function getCount() { try { const r = JSON.parse(localStorage.getItem("sgt") || "{}"); return r.day === today() ? r.n : 0; } catch (e) { return 0; } }
function bump() { const n = getCount() + 1; try { localStorage.setItem("sgt", JSON.stringify({ day: today(), n })); } catch (e) {} return n; }
function getTried() { try { const r = JSON.parse(localStorage.getItem("sgt-tried") || "{}"); return r.day === today() ? r.n : 0; } catch (e) { return 0; } }
function bumpTried() { const n = getTried() + 1; try { localStorage.setItem("sgt-tried", JSON.stringify({ day: today(), n })); } catch (e) {} return n; }
function showTally(n) {
  const t = getTried();
  const drawn = n === 0 ? "" : n === 1 ? "1 card drawn" : n + " cards drawn";
  const tried = t === 0 ? "" : t + " tried";
  $("tally").textContent = [drawn, tried].filter(Boolean).join(" · ") + (drawn || tried ? " today." : "");
}

/* One-minute "Try it now" timer on cards that ask you to do something. */
let tick = null, left = 0;
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function stopTimer() { if (tick) clearInterval(tick); tick = null; }
function resetTry() {
  stopTimer();
  const b = $("try");
  b.hidden = !(current && TRY_KINDS.indexOf(current[0]) >= 0);
  b.textContent = "Try it now · 1 min";
  b.dataset.running = "false";
  $("cheer").textContent = "";
}
function runTry() {
  const b = $("try");
  if (tick) { resetTry(); return; }
  left = TRY_SECONDS;
  b.dataset.running = "true";
  b.textContent = "Stop · " + fmt(left);
  tick = setInterval(() => {
    left--;
    if (left <= 0) {
      stopTimer();
      b.dataset.running = "false";
      b.textContent = "Again";
      $("cheer").textContent = "Nicely done. That counts.";
      bumpTried(); showTally(getCount());
    } else { b.textContent = "Stop · " + fmt(left); }
  }, 1000);
}

function draw(first) {
  if (!pile.length) refill();
  current = pile.pop();
  $("kind").textContent = current[0];
  $("text").textContent = current[1];
  $("count").textContent = (total - pile.length) + " of " + total;
  $("fill").style.width = Math.round((total - pile.length) / total * 100) + "%";
  $("mark").innerHTML = markSvg(KIND_ICON[current[0]]);
  resetTry();
  $("msg").textContent = "";
  const card = $("card"); card.classList.remove("deal"); void card.offsetWidth; card.classList.add("deal");
  if (!first) showTally(bump());
}
function renderDecks() {
  const box = $("decks"); box.textContent = "";
  DECKS.forEach(d => {
    const b = document.createElement("button");
    b.className = "deck"; b.setAttribute("aria-pressed", String(d.id === deckId));
    b.innerHTML = ICONS[d.icon] || "";
    const t = document.createElement("span"); t.textContent = d.name; b.appendChild(t);
    b.addEventListener("click", () => { location.hash = d.id; });
    box.appendChild(b);
  });
}
function renderChips() {
  const box = $("chips"); box.textContent = "";
  const kinds = ["All"].concat(cardsOf().map(c => c[0]).filter((k, i, a) => a.indexOf(k) === i));
  kinds.forEach(k => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = k; b.setAttribute("aria-pressed", String(k === kind));
    b.addEventListener("click", () => { kind = k; current = null; pile = []; renderChips(); draw(false); });
    box.appendChild(b);
  });
}
function openDeck(id, first, pid) {
  deckId = DECKS.some(d => d.id === id) ? id : "everyday";
  planId = deckId === "kine" && KINE && KINE.plans && KINE.plans[pid] ? pid : "";
  document.documentElement.dataset.deck = deckId === "kine" ? "movement" : deckId;
  kind = "All"; current = null; pile = [];
  const pl = plan();
  $("blurb").textContent = pl ? (pl.note || pl.label || "") : deck().blurb;
  const note = $("note"); note.textContent = deck().note || ""; note.hidden = !deck().note;
  const bn = $("banner"), msg = KINE && KINE.message;
  if (deckId === "kine" && msg && msg.text) {
    $("bannerTitle").textContent = msg.title || ("From " + KINE.name); $("bannerText").textContent = msg.text; bn.hidden = false;
  } else if (LINK_MSG) {
    $("bannerTitle").textContent = LINK_MSG.from ? "Message from " + LINK_MSG.from : "A personal message";
    $("bannerText").textContent = (LINK_MSG.to ? "Hi " + LINK_MSG.to + ". " : "") + LINK_MSG.text;
    bn.hidden = false;
  } else { bn.hidden = true; }
  renderDecks(); renderChips(); draw(first);
}
$("next").addEventListener("click", () => draw(false));
$("try").addEventListener("click", runTry);
$("copy").addEventListener("click", async () => {
  const link = location.href.split("#")[0] + (deckId === "everyday" ? "" : "#" + deckId + (planId ? "/" + planId : ""));
  try { await navigator.clipboard.writeText(current[0] + ": " + current[1] + "\n" + link); $("msg").textContent = "Copied. Send it to someone who could use it."; }
  catch (e) { $("msg").textContent = "Couldn't copy here. Select the card text and copy it by hand."; }
});
window.addEventListener("hashchange", () => { const h = parseHash(); readMsg(h.q); openDeck(h.d, false, h.p); });
showTally(getCount());
{ const h = parseHash(); readMsg(h.q); openDeck(h.d, true, h.p); }

/* "My kine" deck: the kinesiologist's own message and cards, from kine.json. Shown only when enabled.
   kine.json is public (this repo is public): keep it free of names and health details. */
fetch("kine.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(k => {
  if (!k || k.enabled !== true || !Array.isArray(k.cards) && !k.plans) return;
  const clean = list => (Array.isArray(list) ? list : []).filter(c => Array.isArray(c) && typeof c[0] === "string" && typeof c[1] === "string").map(c => [c[0], c[1]]);
  const plans = {}; let all = clean(k.cards);
  Object.keys(k.plans || {}).forEach(id => {
    const pl = k.plans[id] || {}; const cs = clean(pl.cards);
    if (cs.length) { plans[id] = { label: String(pl.label || id), note: String(pl.note || ""), cards: cs }; all = all.concat(cs); }
  });
  if (!all.length) return;
  KINE = { name: String(k.name || "your kinesiologist"), message: k.message || null, plans };
  DECKS.push({ id: "kine", name: "My kine", icon: "heart", blurb: "Cards and messages from " + KINE.name + ".", note: "General encouragement only, not medical advice. Follow your practitioner's plan.", cards: all });
  const h = parseHash(); openDeck(h.d === "kine" ? "kine" : deckId, false, h.p);
}).catch(() => {});
</script>
