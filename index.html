<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make sense · Sensee</title>
<meta name="description" content="Make sense. Draw a card. A small thing to do, notice, thank or learn in under a minute. Decks for everyday life, movement motivation and calm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one big tappable card in a single column; chips above, actions below. */
:root {
  --bg: #dff3ec;
  --card: #fffdf6;
  --ink: #12312b;
  --muted: #4b6b63;
  --line: #b4d9cd;
  --accent: #ff6b4a;
  --accent-ink: #2a0e07;
  --chip-on: #12312b;
  --chip-on-ink: #dff3ec;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f2622;
    --card: #17352f;
    --ink: #e6f6f1;
    --muted: #9cc2b8;
    --line: #2b5148;
    --accent: #ff8a6b;
    --accent-ink: #2a0e07;
    --chip-on: #e6f6f1;
    --chip-on-ink: #0f2622;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f2622;
  --card: #17352f;
  --ink: #e6f6f1;
  --muted: #9cc2b8;
  --line: #2b5148;
  --accent: #ff8a6b;
  --accent-ink: #2a0e07;
  --chip-on: #e6f6f1;
  --chip-on-ink: #0f2622;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.5;
  min-height: 100%;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 32px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
header { display: flex; flex-direction: column; gap: 8px; }
h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(2.2rem, 8vw, 3.2rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
header p { margin: 0; color: var(--muted); max-width: 46ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 600 0.9rem var(--body);
  color: var(--ink);
  background: transparent;
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.chip:hover { border-color: var(--ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.card {
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: 20px;
  padding: 28px 24px 24px;
  box-shadow: 6px 6px 0 var(--ink);
  min-height: 260px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  justify-content: space-between;
}
.kind {
  align-self: flex-start;
  font: 800 0.78rem var(--display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 6px;
  padding: 3px 10px;
}
.text {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(1.4rem, 5.2vw, 1.85rem);
  line-height: 1.22;
  margin: 0;
  text-wrap: pretty;
}
.card.pop { animation: pop 320ms ease-out; }
@keyframes pop { from { transform: translateY(8px) rotate(-0.6deg); opacity: 0.4; } to { transform: none; opacity: 1; } }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn {
  font: 800 1.05rem var(--display);
  border: 2px solid var(--ink);
  border-radius: 14px;
  padding: 12px 22px;
  cursor: pointer;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 3px 3px 0 var(--ink);
}
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); }
.tally { color: var(--muted); font-size: 0.95rem; margin: 0; }
.done { font-weight: 600; color: var(--muted); min-height: 1.5em; margin: 0; }
.stock { display: flex; flex-direction: column; gap: 8px; border-top: 2px solid var(--line); padding-top: 16px; }
.stock[hidden], #retire[hidden] { display: none; }
.source { font-size: 0.9rem; color: var(--muted); align-self: flex-start; }
.source[hidden] { display: none; }
.btn:disabled { opacity: 0.6; cursor: progress; }
@media (prefers-reduced-motion: reduce) { .card.pop { animation: none; } }

.source { font-size: 0.9rem; color: var(--muted); align-self: flex-start; }
.source[hidden] { display: none; }
.decks { display: flex; flex-wrap: wrap; gap: 8px; }
.deck { font: 800 1rem var(--display); color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 16px; cursor: pointer; }
.deck[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.blurb { margin: 0; color: var(--muted); max-width: 52ch; }
.note { margin: 0; color: var(--muted); font-size: 0.85rem; }
.note[hidden] { display: none; }
.brand { margin: 0; font: 800 0.9rem var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.foot { border-top: 2px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 8px; }
.foot a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">sensee.ca</p>
    <h1>Make sense.</h1>
    <p>Small good things, one card at a time. Each takes under a minute and tends to leave the day a little lighter than it found it.</p>
  </header>

  <div class="decks" role="group" aria-label="Deck" id="decks"></div>
  <p class="blurb" id="blurb"></p>
  <div class="chips" role="group" aria-label="Kind of card" id="chips"></div>

  <section class="card" id="card" aria-live="polite">
    <span class="kind" id="kind"></span>
    <p class="text" id="text"></p>
  </section>

  <div class="actions">
    <button class="btn" id="next">Another one</button>
    <button class="btn ghost" id="copy">Copy to send</button>
  </div>
  <p class="done" id="msg"></p>
  <p class="note" id="note" hidden></p>
  <p class="tally" id="tally"></p>
  <footer class="foot"><a href="vibration-guard.html">Sensee HVAC Vibration Guard</a> <span aria-hidden="true">·</span> <a href="mailto:sensitlabs@gmail.com">Contact</a></footer>
</main>
<script>
const EVERYDAY = [
  ["Do", "Text someone one specific thing you remember fondly about them. No question attached."],
  ["Do", "Leave the closest parking spot or the first seat for someone else."],
  ["Do", "Open a window for one minute and let the outside in."],
  ["Do", "Drink a full glass of water, slowly, like it's the best thing you've had all day."],
  ["Do", "Put on one song you love and move around for its whole length. Nobody is grading."],
  ["Do", "Leave a kind, specific review for a small business you like."],
  ["Do", "Tidy exactly one surface. Stop when it's done."],
  ["Do", "Ask the next person you talk to what the best part of their day was, then listen to the answer."],
  ["Do", "Hold the door a little longer than necessary and smile at whoever comes through."],
  ["Do", "Pay someone a compliment about a choice they made, not how they look."],
  ["Do", "Write down three things that went okay today. Okay counts."],
  ["Do", "Pet a dog, after asking its person first."],
  ["Do", "Unclench your jaw and drop your shoulders. Now do it again."],
  ["Notice", "Find something yellow within sight. Look at it for ten full seconds."],
  ["Notice", "Listen for the farthest sound you can hear, then the closest."],
  ["Notice", "Look at the sky for thirty seconds. What is it doing right now?"],
  ["Notice", "Find the oldest object in the room. Think about everything it has seen."],
  ["Notice", "Feel the temperature of the air on your hands. Is it warm, cool, or somewhere nice in between?"],
  ["Notice", "Pick one thing near you that someone else designed carefully, like a hinge, a handle or a font."],
  ["Notice", "Notice one person nearby doing something small and kind. Most of it goes unseen."],
  ["Thank", "Think of a teacher who changed how you see something. Send them a short thank-you."],
  ["Thank", "Name someone who made your week easier. Tell them today."],
  ["Thank", "Thank a person who does work you usually don't notice: the cleaner, the driver, the person who restocks the shelves."],
  ["Thank", "Think of a friend who stayed in touch when you didn't. Reach out and say so."],
  ["Thank", "Thank your past self for one thing they did that you're benefiting from today."],
  ["Thank", "Call or message a relative and thank them for one thing they taught you."],
  ["Fact", "Sea otters sometimes hold hands while they sleep so they don't drift apart."],
  ["Fact", "Octopuses have three hearts."],
  ["Fact", "A group of flamingos is called a flamboyance."],
  ["Fact", "Wombats produce cube-shaped droppings, which helps them stay put when used as markers."],
  ["Fact", "Botanically, a banana is a berry. A strawberry is not."],
  ["Fact", "Sunlight takes a little over eight minutes to reach Earth. Today's warmth left the Sun before you finished your morning."],
  ["Fact", "Cows form close friendships and show lower stress when they're with their favorite companions."],
  ["Fact", "Honey found in ancient Egyptian tombs was still edible. Properly stored honey barely spoils."],
  ["Fact", "Bumblebees can learn by watching other bees, and have been taught to roll a ball for a sugary reward."]
];

const DECKS = [
  { id: "everyday", name: "Everyday", blurb: "Little prompts to do, notice, thank and learn.", note: "",
    cards: EVERYDAY },
  { id: "movement", name: "Movement", blurb: "For kinesiologists and their clients. Short prompts to get moving, build the habit and keep going.",
    note: "General encouragement only, not medical advice. Follow your practitioner's plan.",
    cards: [
      ["Move", "Stand up and roll your shoulders back ten times, slowly."],
      ["Move", "Take a two-minute walk, even if it is just around the room."],
      ["Move", "Do five slow sit-to-stands from a chair, taking your time on the way down."],
      ["Move", "Stretch whatever feels tightest for thirty seconds, breathing out as you ease in."],
      ["Move", "Stand on one foot while you brush your teeth, then switch."],
      ["Move", "Take the longer route to your next destination."],
      ["Move", "Do ten slow calf raises while you wait for the kettle."],
      ["Move", "March in place for one minute."],
      ["Mindset", "Five minutes is a real session. Showing up counts."],
      ["Mindset", "Progress is rarely a straight line. A flat week is still part of the trend."],
      ["Mindset", "Compare today's effort to your own last month, not to anyone else."],
      ["Mindset", "A smaller version of the plan, done, beats a perfect version skipped."],
      ["Mindset", "Strong is a skill you build one ordinary day at a time."],
      ["Mindset", "You do not have to feel motivated to start. Start, and motivation often follows."],
      ["Habit", "Attach one exercise to something you already do every day, like coffee or brushing your teeth."],
      ["Habit", "Lay out your workout clothes tonight so tomorrow's start is easier."],
      ["Habit", "Put your next session in your calendar now, with a time and a place."],
      ["Habit", "Pick the easiest version of your exercise and do just that tomorrow."],
      ["Habit", "Tell one person when you plan to move today."],
      ["Habit", "Mark a calendar after each session and watch the chain grow."],
      ["Reflect", "What is one thing your body did for you today that you usually take for granted?"],
      ["Reflect", "When did movement last leave you feeling better than when you started? What was it?"],
      ["Reflect", "What is getting in the way this week, and what is the smallest way around it?"],
      ["Reflect", "What would future you thank you for doing in the next ten minutes?"],
      ["Reflect", "Which part of your routine feels easy now that felt hard a month ago?"],
      ["Reflect", "Who or what helps you keep going? How could you lean on it more?"]
    ] },
  { id: "calm", name: "Calm", blurb: "Quick resets for a busy head.", note: "",
    cards: [
      ["Breathe", "Breathe in for four, out for six. Repeat three times."],
      ["Breathe", "Make your exhale a little slower than your inhale for one minute."],
      ["Breathe", "Rest a hand on your belly and feel it rise and fall for five breaths."],
      ["Ground", "Name five things you can see, four you can touch and three you can hear."],
      ["Ground", "Press your feet into the floor and notice the support under you."],
      ["Ground", "Look at the farthest thing you can see for ten seconds."],
      ["Soften", "Unclench your jaw, drop your shoulders and let your hands go loose."],
      ["Soften", "Tell yourself: this moment will pass, and I can take it one breath at a time."],
      ["Soften", "Take a sip of something warm and notice it all the way down."],
      ["Reset", "Step away from the screen for two minutes."],
      ["Reset", "Write down the one thing that matters most today and set the rest aside."],
      ["Reset", "Open a window and take three slow breaths of fresh air."],
      ["Reset", "Do one thing, then the next. Only the next thing."]
    ] }
];

const $ = id => document.getElementById(id);
let deckId = "everyday", kind = "All", pile = [], current = null;
const deck = () => DECKS.find(d => d.id === deckId) || DECKS[0];

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function refill() {
  pile = shuffle(deck().cards.filter(c => kind === "All" || c[0] === kind));
  if (current && pile.length > 1 && pile[pile.length - 1] === current) pile.unshift(pile.pop());
}
function today() { return new Date().toISOString().slice(0, 10); }
function getCount() { try { const r = JSON.parse(localStorage.getItem("sgt") || "{}"); return r.day === today() ? r.n : 0; } catch (e) { return 0; } }
function bump() { const n = getCount() + 1; try { localStorage.setItem("sgt", JSON.stringify({ day: today(), n })); } catch (e) {} return n; }
function showTally(n) { $("tally").textContent = n === 0 ? "" : n === 1 ? "1 card drawn today." : n + " cards drawn today."; }

function draw(first) {
  if (!pile.length) refill();
  current = pile.pop();
  $("kind").textContent = current[0];
  $("text").textContent = current[1];
  $("msg").textContent = "";
  const card = $("card"); card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
  if (!first) showTally(bump());
}

function renderDecks() {
  const box = $("decks"); box.textContent = "";
  DECKS.forEach(d => {
    const b = document.createElement("button");
    b.className = "deck"; b.textContent = d.name; b.setAttribute("aria-pressed", String(d.id === deckId));
    b.addEventListener("click", () => { location.hash = d.id; });
    box.appendChild(b);
  });
}
function renderChips() {
  const box = $("chips"); box.textContent = "";
  const kinds = ["All"].concat(deck().cards.map(c => c[0]).filter((k, i, a) => a.indexOf(k) === i));
  kinds.forEach(k => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = k; b.setAttribute("aria-pressed", String(k === kind));
    b.addEventListener("click", () => { kind = k; current = null; pile = []; renderChips(); draw(false); });
    box.appendChild(b);
  });
}
function openDeck(id, first) {
  deckId = DECKS.some(d => d.id === id) ? id : "everyday";
  kind = "All"; current = null; pile = [];
  $("blurb").textContent = deck().blurb;
  const note = $("note"); note.textContent = deck().note; note.hidden = !deck().note;
  renderDecks(); renderChips(); draw(first);
}

$("next").addEventListener("click", () => draw(false));
$("copy").addEventListener("click", async () => {
  const link = location.href.split("#")[0] + (deckId === "everyday" ? "" : "#" + deckId);
  try { await navigator.clipboard.writeText(current[0] + ": " + current[1] + "\n" + link); $("msg").textContent = "Copied. Send it to someone who could use it."; }
  catch (e) { $("msg").textContent = "Couldn't copy here. Select the card text and copy it by hand."; }
});
window.addEventListener("hashchange", () => openDeck(location.hash.slice(1), false));

showTally(getCount());
openDeck(location.hash.slice(1), true);
</script>
</body>
</html>
